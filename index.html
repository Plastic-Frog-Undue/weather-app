<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
</head>
<body>
    <div class="container">

        <div class="search-bar">
          <input type="text" id="city-input" placeholder="Enter city" />
          <button id="search-btn">Search</button>
        </div>
      </div>
      
      <div class="weather-card" id="weather-display" style="display:none;">
        <div class="current-weather">
          <h2 id="city-name"></h2>
          <p id="description"></p>
          <p class="temperature" id="temp"></p>
          <img id="weather-icon" src="" alt="weather icon" />
        </div>
      
        <div class="hourly-forecast" id="hourly-forecast"></div>
      
        <div class="details">
          <p id="wind"></p>
          <p id="humidity"></p>
          <p id="pressure"></p>
          <p id="sunrise-sunset"></p>
        </div>
      </div>
      
      

      <script type="module" src="bundle.js"></script>
</body>
</html>
